name: Run EGX Stock Alert Bot

on:
  schedule:
    # يعمل كل 3 دقائق، من الأحد للأربعاء والخميس، من الساعة 6:00 إلى 13:00 بالتوقيت العالمي UTC (التي تعادل 8:00 صباحاً إلى 3:00 عصراً بتوقيت مصر)
    - cron: '*/3 6-13 * * 0-4'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Application Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          python bot.py
